name: Build OpenFIRE-App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

env:
  QT_VERSION: "6.5.2"
  QT_VERSION_5: "5.15.2"

jobs:
  build-linux-qt6:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get git hash
      id: githash
      run: echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Setup Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        arch: ${{ matrix.arch }}
        modules: qtcharts qtnetworkauth qtwebengine qtwebview qtlocation qtmultimedia qtquick3d qtscript qtscxml qtsensors qtserialport qtsvg qtsvgwidgets qttools qttranslations qtwebchannel qtwebsockets qtwebview

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgl1-mesa-dev

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DOFAPP_GITHASH=${{ steps.githash.outputs.hash }}

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Create AppImage (x86_64 only)
      if: matrix.arch == 'x86_64'
      run: |
        cd build
        # Install linuxdeployqt for AppImage creation
        wget -c -nv "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
        chmod a+x linuxdeployqt-continuous-x86_64.AppImage
        ./linuxdeployqt-continuous-x86_64.AppImage OpenFIREapp -appimage
        mv OpenFIREapp-*.AppImage ../OpenFIRE_App-x86_64.AppImage

    - name: Upload Linux AppImage
      if: matrix.arch == 'x86_64'
      uses: actions/upload-artifact@v4
      with:
        name: OpenFIRE_App-Linux-x86_64
        path: OpenFIRE_App-x86_64.AppImage

    - name: Upload Linux binary
      uses: actions/upload-artifact@v4
      with:
        name: OpenFIRE_App-Linux-${{ matrix.arch }}
        path: build/OpenFIREapp

  build-linux-qt5:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get git hash
      id: githash
      run: echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Setup Qt5
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION_5 }}
        arch: ${{ matrix.arch }}
        modules: qtcharts qtnetworkauth qtwebengine qtwebview qtlocation qtmultimedia qtquick3d qtscript qtscxml qtsensors qtserialport qtsvg qttools qttranslations qtwebchannel qtwebsockets qtwebview

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgl1-mesa-dev

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DOFAPP_QT_VERSION=Qt5 -DOFAPP_GITHASH=${{ steps.githash.outputs.hash }}

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Upload Linux Qt5 binary
      uses: actions/upload-artifact@v4
      with:
        name: OpenFIRE_App-Linux-Qt5-${{ matrix.arch }}
        path: build/OpenFIREapp

  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get git hash
      id: githash
      run: echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Setup Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        arch: x86_64
        modules: qtcharts qtnetworkauth qtwebengine qtwebview qtlocation qtmultimedia qtquick3d qtscript qtscxml qtsensors qtserialport qtsvg qtsvgwidgets qttools qttranslations qtwebchannel qtwebsockets qtwebview

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DOFAPP_GITHASH=${{ steps.githash.outputs.hash }}

    - name: Build
      run: |
        cd build
        cmake --build . --config Release --parallel

    - name: Create Windows package
      run: |
        cd build
        mkdir OpenFIREapp
        copy Release\OpenFIREapp.exe OpenFIREapp\
        # Copy Qt dependencies (this would need to be enhanced with windeployqt)
        # For now, just copy the executable
        7z a -tzip OpenFIRE_App-Windows-x86_64.zip OpenFIREapp\

    - name: Upload Windows package
      uses: actions/upload-artifact@v4
      with:
        name: OpenFIRE_App-Windows-x86_64
        path: build/OpenFIRE_App-Windows-x86_64.zip

  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get git hash
      id: githash
      run: echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Setup Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        arch: x86_64
        modules: qtcharts qtnetworkauth qtwebengine qtwebview qtlocation qtmultimedia qtquick3d qtscript qtscxml qtsensors qtserialport qtsvg qtsvgwidgets qttools qttranslations qtwebchannel qtwebsockets qtwebview

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DOFAPP_GITHASH=${{ steps.githash.outputs.hash }}

    - name: Build
      run: |
        cd build
        make -j$(sysctl -n hw.ncpu)

    - name: Create macOS package
      run: |
        cd build
        # Create a simple package for now
        mkdir OpenFIREapp.app
        mkdir OpenFIREapp.app/Contents
        mkdir OpenFIREapp.app/Contents/MacOS
        cp OpenFIREapp OpenFIREapp.app/Contents/MacOS/
        # Create basic Info.plist
        echo '<?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>OpenFIREapp</string>
            <key>CFBundleIdentifier</key>
            <string>org.TeamOpenFIRE.OpenFIREapp</string>
            <key>CFBundleName</key>
            <string>OpenFIRE App</string>
            <key>CFBundleVersion</key>
            <string>3.0.1</string>
            <key>CFBundleShortVersionString</key>
            <string>3.0.1</string>
        </dict>
        </plist>' > OpenFIREapp.app/Contents/Info.plist
        ditto -c -k --sequesterRsrc --keepParent OpenFIREapp.app OpenFIRE_App-macOS-x86_64.zip

    - name: Upload macOS package
      uses: actions/upload-artifact@v4
      with:
        name: OpenFIRE_App-macOS-x86_64
        path: build/OpenFIRE_App-macOS-x86_64.zip

  release:
    needs: [build-linux-qt6, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release assets
      run: |
        mkdir -p release-assets
        # Copy and rename artifacts
        cp artifacts/OpenFIRE_App-Linux-x86_64/OpenFIRE_App-x86_64.AppImage release-assets/
        cp artifacts/OpenFIRE_App-Windows-x86_64/OpenFIRE_App-Windows-x86_64.zip release-assets/
        cp artifacts/OpenFIRE_App-macOS-x86_64/OpenFIRE_App-macOS-x86_64.zip release-assets/

    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./release-assets/OpenFIRE_App-x86_64.AppImage
        asset_name: OpenFIRE_App-x86_64.AppImage
        asset_content_type: application/octet-stream

    - name: Upload Windows release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./release-assets/OpenFIRE_App-Windows-x86_64.zip
        asset_name: OpenFIRE_App-Windows-x86_64.zip
        asset_content_type: application/zip

    - name: Upload macOS release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./release-assets/OpenFIRE_App-macOS-x86_64.zip
        asset_name: OpenFIRE_App-macOS-x86_64.zip
        asset_content_type: application/zip
