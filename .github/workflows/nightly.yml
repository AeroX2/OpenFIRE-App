name: Nightly Build

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

env:
  QT_VERSION: "6.5.2"

jobs:
  nightly-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get git hash and date
      id: gitinfo
      run: |
        echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
        echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

    - name: Setup Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        arch: ${{ matrix.arch }}
        modules: qtserialport qtsvg qtsvgwidgets qttools

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgl1-mesa-dev

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DOFAPP_GITHASH=${{ steps.gitinfo.outputs.hash }}

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Create nightly AppImage (x86_64 only)
      if: matrix.arch == 'x86_64'
      run: |
        cd build
        # Install linuxdeployqt for AppImage creation
        wget -c -nv "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
        chmod a+x linuxdeployqt-continuous-x86_64.AppImage
        ./linuxdeployqt-continuous-x86_64.AppImage OpenFIREapp -appimage
        mv OpenFIREapp-*.AppImage ../OpenFIRE_App-nightly-${{ steps.gitinfo.outputs.date }}-${{ steps.gitinfo.outputs.hash }}-x86_64.AppImage

    - name: Upload nightly Linux AppImage
      if: matrix.arch == 'x86_64'
      uses: actions/upload-artifact@v4
      with:
        name: OpenFIRE_App-nightly-Linux-x86_64-${{ steps.gitinfo.outputs.date }}
        path: OpenFIRE_App-nightly-${{ steps.gitinfo.outputs.date }}-${{ steps.gitinfo.outputs.hash }}-x86_64.AppImage
        retention-days: 30

    - name: Upload nightly Linux binary
      uses: actions/upload-artifact@v4
      with:
        name: OpenFIRE_App-nightly-Linux-${{ matrix.arch }}-${{ steps.gitinfo.outputs.date }}
        path: build/OpenFIREapp
        retention-days: 30

  nightly-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get git hash and date
      id: gitinfo
      run: |
        echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "date=$(Get-Date -Format 'yyyyMMdd')" >> $GITHUB_OUTPUT
        echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

    - name: Setup Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        arch: x86_64
        modules: qtserialport qtsvg qtsvgwidgets qttools

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DOFAPP_GITHASH=${{ steps.gitinfo.outputs.hash }}

    - name: Build
      run: |
        cd build
        cmake --build . --config Release --parallel

    - name: Deploy Qt dependencies
      run: |
        cd build
        $env:QT_DIR\bin\windeployqt.exe --release --no-compiler-runtime --no-translations --no-system-d3d-compiler Release\OpenFIREapp.exe

    - name: Create nightly Windows package
      run: |
        cd build
        mkdir OpenFIREapp
        copy Release\OpenFIREapp.exe OpenFIREapp\
        copy Release\*.dll OpenFIREapp\
        if (Test-Path "Release\platforms") { xcopy /E /I Release\platforms OpenFIREapp\platforms }
        if (Test-Path "Release\styles") { xcopy /E /I Release\styles OpenFIREapp\styles }
        if (Test-Path "Release\imageformats") { xcopy /E /I Release\imageformats OpenFIREapp\imageformats }
        if (Test-Path "Release\iconengines") { xcopy /E /I Release\iconengines OpenFIREapp\iconengines }
        
        # Create nightly README
        echo "OpenFIRE Configuration App - Nightly Build" > OpenFIREapp\README.txt
        echo "Build Date: ${{ steps.gitinfo.outputs.date }}" >> OpenFIREapp\README.txt
        echo "Git Hash: ${{ steps.gitinfo.outputs.hash }}" >> OpenFIREapp\README.txt
        echo "Branch: ${{ steps.gitinfo.outputs.branch }}" >> OpenFIREapp\README.txt
        echo "" >> OpenFIREapp\README.txt
        echo "This is a nightly development build. Use at your own risk." >> OpenFIREapp\README.txt
        echo "" >> OpenFIREapp\README.txt
        echo "To run: Double-click OpenFIREapp.exe" >> OpenFIREapp\README.txt
        
        7z a -tzip OpenFIRE_App-nightly-${{ steps.gitinfo.outputs.date }}-${{ steps.gitinfo.outputs.hash }}-Windows-x86_64.zip OpenFIREapp\

    - name: Upload nightly Windows package
      uses: actions/upload-artifact@v4
      with:
        name: OpenFIRE_App-nightly-Windows-x86_64-${{ steps.gitinfo.outputs.date }}
        path: build/OpenFIRE_App-nightly-${{ steps.gitinfo.outputs.date }}-${{ steps.gitinfo.outputs.hash }}-Windows-x86_64.zip
        retention-days: 30

  create-nightly-release:
    needs: [nightly-linux, nightly-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' # Only create release on manual trigger
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get git info
      id: gitinfo
      run: |
        echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
        echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create nightly release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: nightly-${{ steps.gitinfo.outputs.date }}-${{ steps.gitinfo.outputs.hash }}
        name: Nightly Build ${{ steps.gitinfo.outputs.date }} (${{ steps.gitinfo.outputs.hash }})
        body: |
          Nightly development build from branch `${{ steps.gitinfo.outputs.branch }}`
          
          **Build Info:**
          - Date: ${{ steps.gitinfo.outputs.date }}
          - Git Hash: ${{ steps.gitinfo.outputs.hash }}
          - Branch: ${{ steps.gitinfo.outputs.branch }}
          
          **Warning:** This is a development build and may contain bugs or incomplete features.
        draft: false
        prerelease: true
        files: |
          artifacts/OpenFIRE_App-nightly-Linux-x86_64-${{ steps.gitinfo.outputs.date }}/OpenFIRE_App-nightly-${{ steps.gitinfo.outputs.date }}-${{ steps.gitinfo.outputs.hash }}-x86_64.AppImage
          artifacts/OpenFIRE_App-nightly-Windows-x86_64-${{ steps.gitinfo.outputs.date }}/OpenFIRE_App-nightly-${{ steps.gitinfo.outputs.date }}-${{ steps.gitinfo.outputs.hash }}-Windows-x86_64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
